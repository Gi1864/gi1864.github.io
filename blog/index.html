---
layout: default
title: Blog
permalink: /blog/
---

<main class="blog-page">

    <h1 class="page-title">Blog</h1>

    <div id="article-list">

       {% assign blog_posts =
        site.categories.blog | sort: "date"
        | reverse %}
        {% for post in site.posts %}

        <article class="article">

            <div class="article-meta">
                {{ post.date | date: "%B %-d, %Y" }}
            </div>

            <h2>
                <a href="{{ post.url | relative_url }}" style="color: inherit; text-decoration: none;">
                    {{ post.title }}
                </a>
            </h2>

            <p>
                {{ post.excerpt | strip_html | truncate: 220 }}
            </p>

            <a href="{{ post.url | relative_url }}" class="read-more">
                Read article →
            </a>

        </article>

        {% endfor %}

    </div>

    <!-- Numbered pagination -->

    <nav id="pagination" aria-label="Blog pagination"
         style="display:flex; justify-content:center; align-items:center; gap:10px; margin-top:40px;">
    </nav>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const articles = Array.from(
        document.querySelectorAll("#article-list .article")
    );

    const pagination = document.getElementById("pagination");

    const perPage = 4;
    const totalPages = Math.ceil(articles.length / perPage);

    let currentPage = 1;

    function showPage(page) {

        currentPage = page;

        articles.forEach(function (article, index) {
            const start = (page - 1) * perPage;
            const end = start + perPage;

            article.style.display =
                index >= start && index < end ? "" : "none";
        });

        pagination.innerHTML = "";

        if (totalPages <= 1) return;

        function addButton(label, pageNumber, active, disabled) {

            const button = document.createElement("button");

            button.textContent = label;
            button.type = "button";
            button.disabled = disabled;

            button.style.cssText =
                "padding:7px 12px; border:1px solid #dedbd5;" +
                "background:" + (active ? "#242424" : "transparent") + ";" +
                "color:" + (active ? "#fff" : "#242424") + ";" +
                "border-radius:4px; cursor:pointer; font:inherit;";

            button.addEventListener("click", function () {
                showPage(pageNumber);
                window.scrollTo({ top: 0, behavior: "smooth" });
            });

            pagination.appendChild(button);
        }

        addButton("Previous", currentPage - 1, false, currentPage === 1);

        for (let i = 1; i <= totalPages; i++) {
            addButton(String(i), i, i === currentPage, false);
        }

        addButton("Next", currentPage + 1, false, currentPage === totalPages);
    }

    showPage(1);

});
</script>
